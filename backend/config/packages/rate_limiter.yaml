# Limits per IP address are high because a whole room on campus Wi-Fi can share one address.
framework:
    rate_limiter:
        registration:
            policy: sliding_window
            limit: 500
            interval: '1 hour'
        # sign-up links sent to one address, so nobody can flood someone else's inbox
        registration_email:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        # wrong passwords for one account
        login_link:
            policy: sliding_window
            limit: 500
            interval: '1 hour'
        login_link_email:
            policy: sliding_window
            limit: 3
            interval: '15 minutes'
        login_account:
            policy: sliding_window
            limit: 5
            interval: '5 minutes'
        # tries at the current password in Settings, per account
        password_change:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        # wrong passwords for any account
        login_address:
            policy: sliding_window
            limit: 500
            interval: '5 minutes'

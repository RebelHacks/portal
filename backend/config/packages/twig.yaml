twig:
    file_name_pattern: '*.twig'
    # Times are saved in UTC (see Kernel.php). The |date filter shows them in Las Vegas time.
    date:
        timezone: 'America/Los_Angeles'
    globals:
        hacker_pages_open: '%app.hacker_pages_open%'

when@test:
    twig:
        strict_variables: true

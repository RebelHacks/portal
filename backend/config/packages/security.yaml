security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        login:
            pattern: ^/api/login
            stateless: true
            provider: app_user_provider
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            # slows password guessing; the limits are in rate_limiter.yaml
            login_throttling:
                limiter: app.login_rate_limiter
        register:
            pattern: ^/api/register
            stateless: true

        api:
            pattern: ^/api
            stateless: true
            jwt: ~

        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
            login_throttling:
                limiter: app.login_rate_limiter
            logout:
                path: app_logout
                # logout links carry a token, so other sites can't sign people out
                enable_csrf: true
                # where to redirect after logout
                # target: app_any_route

            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Only the first rule that matches is used. Anything not listed needs a login.
    # Paths end in \z, not $, because $ also matches before a trailing newline (%0A).
    access_control:
        - { path: ^/api/login\z, roles: PUBLIC_ACCESS }
        - { path: ^/api/register\z, roles: PUBLIC_ACCESS }
        # only changes the logged-in user's own major and track
        - { path: ^/api/users/profile\z, roles: IS_AUTHENTICATED_FULLY }
        # the rest of the old dashboard API is organizers only until the new portal replaces it
        - { path: ^/api, roles: ROLE_ADMIN }
        - { path: ^/\z, roles: PUBLIC_ACCESS } # the login page
        - { path: ^/register\z, roles: PUBLIC_ACCESS }
        - { path: ^/verify/email\z, roles: PUBLIC_ACCESS }
        - { path: ^/logout\z, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
